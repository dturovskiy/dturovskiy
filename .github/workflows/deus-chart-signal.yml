# Pilot: GitHub-only, no webhook hosting and no personal access token.
# Prerequisite: DEUS_CHART_APP_ID (Actions variable) and
# DEUS_CHART_APP_PRIVATE_KEY (Actions secret) in each source repository.
# GitHub App must be installed ONLY on dturovskiy/deus-commit-chart,
# with Actions: read and write (no Contents write).
name: Signal contribution chart

on:
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  pull_request_review:
    types: [submitted]
  discussion:
    types: [created, answered]

permissions: {}

jobs:
  signal:
    # Never check out or execute issue/PR-controlled code.
    if: >-
      github.repository != 'dturovskiy/deus-commit-chart' &&
      (
        (github.event_name == 'workflow_dispatch' && github.actor == 'dturovskiy') ||
        (github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (github.event_name == 'issues' && github.actor == 'dturovskiy') ||
        (github.event_name == 'pull_request_target' && github.actor == 'dturovskiy') ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.user.login == 'dturovskiy' &&
          !github.event.pull_request.head.repo.fork) ||
        (github.event_name == 'discussion' && github.actor == 'dturovskiy')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch trusted publisher with one-hour GitHub App grant
        shell: bash
        env:
          DEUS_CHART_APP_ID: ${{ vars.DEUS_CHART_APP_ID }}
          DEUS_CHART_APP_PRIVATE_KEY: ${{ secrets.DEUS_CHART_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const {sign} = require('node:crypto');
          const APP_ID = Number(process.env.DEUS_CHART_APP_ID);
          const PRIVATE_KEY = process.env.DEUS_CHART_APP_PRIVATE_KEY || '';
          const TARGET = 'dturovskiy/deus-commit-chart';
          const TARGET_ID = 1273765359;
          const API = 'https://api.github.com';
          const headers = {
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'deus-commit-chart-source-signal',
          };

          async function request(method, path, bearer, data) {
            if (!path.startsWith('/') || path.includes('://')) throw Error('API_PATH_INVALID');
            const res = await fetch(API + path, {
              method,
              headers: {
                ...headers,
                'Authorization': 'Bearer ' + bearer,
                ...(data === undefined ? {} : {'Content-Type': 'application/json'}),
              },
              ...(data === undefined ? {} : {body: JSON.stringify(data)}),
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            });
            if (!res.ok) throw Error('GITHUB_API_' + method + '_' + res.status);
            return res.status === 204 ? null : res.json();
          }

          async function main() {
            if (!Number.isSafeInteger(APP_ID) || APP_ID <= 0 ||
                !PRIVATE_KEY.includes('-----BEGIN') || !PRIVATE_KEY.includes('PRIVATE KEY-----')) {
              throw Error('APP_INSTALLATION_CREDENTIALS_MISSING');
            }
            const now = Math.floor(Date.now() / 1000);
            const encoded = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const signed = encoded({alg: 'RS256', typ: 'JWT'}) + '.' +
              encoded({iat: now - 60, exp: now + 540, iss: String(APP_ID)});
            const jwt = signed + '.' +
              sign('RSA-SHA256', Buffer.from(signed), PRIVATE_KEY).toString('base64url');

            const installation = await request('GET', '/repos/' + TARGET + '/installation', jwt);
            if (installation?.app_id !== APP_ID || !Number.isSafeInteger(installation?.id)) {
              throw Error('WRONG_APP_INSTALLATION');
            }
            const grant = await request('POST',
              '/app/installations/' + installation.id + '/access_tokens', jwt,
              {repository_ids: [TARGET_ID], permissions: {actions: 'write'}});
            const allowed = grant?.repositories;
            if (grant?.permissions?.actions !== 'write' ||
                !Array.isArray(allowed) || allowed.length !== 1 ||
                allowed[0]?.id !== TARGET_ID ||
                typeof grant?.token !== 'string' || !grant.token) {
              throw Error('GRANT_SCOPE_NOT_CONFIRMED');
            }
            await request('POST',
              '/repos/' + TARGET + '/actions/workflows/publish-pages.yml/dispatches',
              grant.token, {ref: 'main'});
            console.log('EVENT_DISPATCH_ACCEPTED');
          }
          main().catch(error => {
            // Never log secrets, JWT, installation token, or API bodies.
            console.error('EVENT_SIGNAL_FAILED: ' + String(error.message).slice(0, 120));
            process.exitCode = 1;
          });
          NODE
