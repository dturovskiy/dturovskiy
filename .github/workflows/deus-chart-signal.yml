# COPY INTO EACH SOURCE REPOSITORY at .github/workflows/deus-chart-signal.yml
# No cron, hosted webhook endpoint or polling. Requires a repository secret
# DEUS_CHART_TRIGGER_TOKEN: a fine-grained PAT limited to ONLY
# dturovskiy/deus-commit-chart with Actions: write.
# Never use a broad personal token or commit credential files.
name: Signal contribution chart

on:
  workflow_dispatch:
  push:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  pull_request_review:
    types: [submitted]
  discussion:
    types: [created, answered]

permissions: {}

jobs:
  signal:
    # No source checkout, no execution of PR-provided code or scripts.
    if: >-
      github.repository != 'dturovskiy/deus-commit-chart' &&
      (
        (github.event_name == 'workflow_dispatch' && github.actor == 'dturovskiy') ||
        (github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (github.event_name == 'issues' && github.actor == 'dturovskiy') ||
        (github.event_name == 'pull_request_target' && github.actor == 'dturovskiy') ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.user.login == 'dturovskiy' &&
          !github.event.pull_request.head.repo.fork) ||
        (github.event_name == 'discussion' && github.actor == 'dturovskiy')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch chart publisher in its own trusted repository
        env:
          GH_TOKEN: ${{ secrets.DEUS_CHART_TRIGGER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing DEUS_CHART_TRIGGER_TOKEN (target Actions:write only)"
            exit 1
          fi
          printf '%s' '{"ref":"main"}' | gh api -X POST \
            -H 'Accept: application/vnd.github+json' \
            /repos/dturovskiy/deus-commit-chart/actions/workflows/publish-pages.yml/dispatches \
            --input -
